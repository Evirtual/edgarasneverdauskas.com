  <line x1="20" y1="10" x2="20" y2="54" stroke="#2c3033" stroke-width="1.5"/>
  <rect x="26" y="14" width="22" height="6" rx="3" fill="#5eead4"/>
  <rect x="26" y="25" width="14" height="6" rx="3" fill="#d97757"/>
  <rect x="26" y="36" width="30" height="6" rx="3" fill="#4285f4"/>
  <rect x="26" y="47" width="10" height="6" rx="3" fill="#e0a800"/>
</svg>
